# RAHBAR corpus: FAST-NUCES public documents (nu.edu.pk), public pages only.
# Every URL was checked to download on 7 November 2026.
#
#   python corpus/fetch.py            # download into corpus/raw/ (gitignored)
#   python corpus/fetch.py --verify   # re-hash against corpus/MANIFEST.md
#
# doc_version and superseded become chunk metadata; the API's retriever filters out
# superseded: true unless the question explicitly asks about an older version.
# docs/CORPUS.md maps every document to the seven required properties.

documents:

  # Property 2 (version pair) + 7 (exact clause numbers, CGPA thresholds).
  # The 2023 rules are the repealed version: still linked from /Student/RulesUndergrad.
  - name: Undergraduate Academic Rules (Aug 2023)
    url: http://nu.edu.pk/public/downloads/Academic-Rules-Undergrad-Aug-2023.pdf
    doc_version: "2023-08"
    superseded: true

  - name: Academic Rules Handbook (Jun 2026)
    url: https://nu.edu.pk/public/downloads/Academic_Rules_Handbook_2026.pdf
    doc_version: "2026-06"
    superseded: false

  # Same rules, 5 pages, different clause numbers (attendance is clause 1 here, 1.21 above).
  - name: Prospectus 2026 - Academic Rules and Regulations
    url: https://nu.edu.pk/Admissions/ProspectusUpload/Academic Rules and Regulations.pdf
    doc_version: "2026"
    superseded: false

  # Property 5: long definitions (the Generative AI policy has numbered sub-sections).
  - name: Student Handbook (Jun 2026)
    url: https://nu.edu.pk/public/downloads/Student_Handbook_2026.pdf
    doc_version: "2026-06"
    superseded: false

  # Property 4: tables (faculty by campus, graduates, publications); versions over time.
  - name: Annual Report 2019-20
    url: https://nu.edu.pk/public/downloads/AnnualReportForm/Annual Report 2019-20.pdf
    doc_version: "2019-20"
    superseded: false

  - name: Annual Report 2023-24
    url: https://nu.edu.pk/public/downloads/AnnualReportForm/Annual Report 2023-24.pdf
    doc_version: "2023-24"
    superseded: false

  # Property 4: HTML tables (tuition per credit hour, miscellaneous fees, grade points).
  - name: Fee Structure page
    url: https://www.nu.edu.pk/Admissions/FeeStructure
    doc_version: "2026-27"
    superseded: false

  - name: Grading page
    url: https://www.nu.edu.pk/Student/Grading
    doc_version: "2026"
    superseded: false

  # Property 3: scanned, image-only PDF (pdffonts lists no fonts). OCR'd by the indexer.
  - name: Faculty Entrepreneurship and Technical Start-ups Policy
    url: https://nu.edu.pk/OricResources/ResearchPolicies/27.pdf?20220530
    doc_version: "2022-05"
    superseded: false

  # Property 6: deliberately ABSENT. Hostel and transport rules live in the prospectus's
  # "Transport and Hostel Facilities" PDF, which we leave out on purpose. The Student
  # Handbook only says hostels exist. Golden questions g16 and g17 must abstain.
  # - name: Prospectus - Transport and Hostel Facilities
  #   url: https://nu.edu.pk/Admissions/ProspectusUpload/Transport and Hostel Facilities.pdf
