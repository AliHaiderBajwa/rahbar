apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
labels:
  - pairs: {app.kubernetes.io/part-of: rahbar}
    includeSelectors: false
# Order is for readers; kubectl sorts by kind (Namespace first, Job last).
# secret.placeholder.yaml is NOT listed on purpose: it would overwrite the real Secret.
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - services.yaml
  - chroma-statefulset.yaml
  - redis.yaml
  - api-deployment.yaml
  - ui-deployment.yaml
  - hpa.yaml
  - pdb.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - indexer-job.yaml
  - reindex-cronjob.yaml
