# The SHAPE of rahbar-secret, for readers. Placeholder only, and deliberately NOT listed
# in kustomization.yaml: applying it would overwrite the real Secret. Create the real one
# from the command line (the value never touches a file):
#   export LLM_API_KEY=...        # a Groq key
#   kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="$LLM_API_KEY"
# (or `make secret`). Base64 in a Secret is encoding, not encryption.
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
