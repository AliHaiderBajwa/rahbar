# Weekly re-index: the same image, arguments and pod spec as the indexer Job, so
# `kubectl create job --from=cronjob/reindex ...` is the manual re-index command.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  namespace: rahbar
  labels: {app: indexer, app.kubernetes.io/part-of: rahbar}
spec:
  schedule: "0 3 * * 0"            # Sundays 03:00, cluster time
  concurrencyPolicy: Forbid        # never two writers at once
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      labels: {app: indexer, app.kubernetes.io/part-of: rahbar}
    spec:
      backoffLimit: 4
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: {app: indexer, app.kubernetes.io/part-of: rahbar}
        spec:
          serviceAccountName: indexer
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            # Download the corpus listed in corpus/sources.yaml into an emptyDir and compare
            # every SHA-256 with the committed corpus/MANIFEST.md (PIPELINE.md, "How the
            # documents reach the Job"). Nothing from nu.edu.pk is baked into an image.
            - name: fetch-corpus
              image: rahbar-indexer
              imagePullPolicy: IfNotPresent
              command: ["python", "corpus/fetch.py", "--dest", "/corpus"]
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {cpu: 200m, memory: 192Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: corpus, mountPath: /corpus}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: indexer
              image: rahbar-indexer
              imagePullPolicy: IfNotPresent
              args: []                      # the real pipeline; ["--dummy"] for week-1 testing
              envFrom:
                - configMapRef: {name: rahbar-config}
              # Measured peak (docs/evidence/kubectl-top.txt): OCR of the scanned 2023 rules
              # plus pdfplumber on the 85-page annual report. Limit = peak + ~50% margin.
              # Too low -> OOMKilled, exit code 137, and the Job retries up to backoffLimit.
              resources:
                requests: {cpu: 250m, memory: 384Mi}
                limits: {cpu: "1500m", memory: 1Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: corpus, mountPath: /corpus, readOnly: true}
                - {name: tmp, mountPath: /tmp}      # pdf2image and tesseract write here
          volumes:
            - name: corpus
              emptyDir: {sizeLimit: 256Mi}
            - name: tmp
              emptyDir: {sizeLimit: 512Mi}
