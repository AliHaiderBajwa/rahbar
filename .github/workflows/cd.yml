# CD: every push to main (i.e. every merged pull request).
# test -> build-push (Docker Hub, tagged with the commit SHA) -> deploy (ephemeral k3d
# cluster that PULLS those exact SHA images, rollout status, smoke test via the Ingress).
# `needs:` on each step: nothing is published from code that failed its tests, and
# nothing is deployed that was not published.
name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  REGISTRY_USER: ${{ vars.DOCKERHUB_USERNAME }}
  KUSTOMIZE_VERSION: v5.6.0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - run: ruff check api indexer eval corpus scripts
      - name: pytest (stub provider, coverage >= 60%)
        run: |
          (cd api && RETRIEVER=stub LLM_PROVIDER=stub pytest -q --cov=app --cov-fail-under=60)
          (cd indexer && pytest -q --cov=pipeline --cov-fail-under=60)

  build-push:
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: log in to Docker Hub (access token from GitHub Secrets, never a password)
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: api -> docker.io/${{ env.REGISTRY_USER }}/rahbar-api:${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: docker.io/${{ env.REGISTRY_USER }}/rahbar-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: ui -> docker.io/${{ env.REGISTRY_USER }}/rahbar-ui:${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          tags: docker.io/${{ env.REGISTRY_USER }}/rahbar-ui:${{ github.sha }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
      - name: indexer -> docker.io/${{ env.REGISTRY_USER }}/rahbar-indexer:${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          context: indexer
          build-contexts: |
            corpus=corpus
            fixtures=eval/fixtures
          push: true
          tags: docker.io/${{ env.REGISTRY_USER }}/rahbar-indexer:${{ github.sha }}
          cache-from: type=gha,scope=indexer
          cache-to: type=gha,mode=max,scope=indexer

  deploy:
    needs: [build-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: install kustomize
        run: curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
      - name: deploy the SHA-tagged images to an ephemeral cluster and smoke-test the Ingress
        run: |
          prefix="docker.io/${REGISTRY_USER}"
          scripts/ci/k3d-e2e.sh "$prefix/rahbar-api:${GITHUB_SHA}" "$prefix/rahbar-ui:${GITHUB_SHA}" \
            "$prefix/rahbar-indexer:${GITHUB_SHA}"
      - name: what is running? one commit SHA
        run: |
          kubectl -n rahbar get deploy,job -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.template.spec.containers[0].image}{"\n"}{end}' | tee /tmp/running.txt
          ! grep -q ':latest' /tmp/running.txt
          grep -q "${GITHUB_SHA}" /tmp/running.txt
          kubectl -n rahbar rollout history deploy/api
